# Pull-request / push checks on GitHub-hosted runners (free for public repos; private repos use
# the free monthly minutes). Hosted runners have no GPU, so GPU tests and the offline .exe build run
# locally with scripts\test.ps1 -Gpu and scripts\build.ps1 (see docs/windows-build.md).
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: "-1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Python dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m playwright install --with-deps chromium

      - name: Lint (ruff, incl. bandit security rules)
        run: ruff check engine.py server.py gpu_worker.py desktop.py notify.py feedback.py voice_engine.py voice_studio.py voice_profiles.py voice_tones.py story_script.py voice_worker.py tests benchmarks scripts packaging

      - name: Type check (mypy)
        run: mypy engine.py server.py gpu_worker.py desktop.py notify.py feedback.py voice_engine.py voice_studio.py voice_profiles.py voice_tones.py story_script.py benchmarks/metrics.py benchmarks/audio_quality.py

      - name: Unit tests
        run: pytest tests/test_engine.py tests/test_engine_models.py tests/test_worker.py tests/test_desktop.py tests/test_story_script.py tests/test_voice_engine.py tests/test_voice_studio.py -q -rs --cov --cov-report=

      - name: Integration / API / security tests
        run: pytest tests/test_api.py tests/test_feedback.py tests/test_notify.py tests/test_voice_api.py -q -rs --cov --cov-append --cov-report=

      - name: Coverage >= 85 %
        run: coverage report --fail-under=85

      - name: End-to-end tests (Chromium)
        run: pytest tests/e2e/test_ui.py tests/e2e/test_theme.py tests/e2e/test_voice_ui.py -q -rs --browser chromium

      - name: Dependency audit (pip-audit)
        run: pip-audit --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build web image (CPU)
        run: docker build -t mixlumo:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name mixlumo -p 7860:7860 mixlumo:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7860/api/info -o info.json; then break; fi
            sleep 2
          done
          cat info.json
          grep -q '"web":true' info.json
          curl -fsS http://127.0.0.1:7860/ | grep -q '<title>Mixlumo'
          docker exec mixlumo ffmpeg -version | head -1
          docker image ls mixlumo:ci

      - name: Container logs
        if: always()
        run: docker logs mixlumo || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
