# Pull-request / push checks on GitHub-hosted runners (free for public repos; private repos use
# the free monthly minutes). Hosted runners have no GPU, so GPU tests and the offline .exe build run
# locally with scripts\test.ps1 -Gpu and scripts\build.ps1 (see docs/windows-build.md).
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: "-1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Python dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m playwright install --with-deps chromium

      - name: Lint (ruff, incl. bandit security rules)
        run: ruff check engine.py server.py gpu_worker.py desktop.py notify.py feedback.py tests benchmarks scripts packaging

      - name: Type check (mypy)
        run: mypy engine.py server.py gpu_worker.py desktop.py notify.py feedback.py benchmarks/metrics.py benchmarks/audio_quality.py

      - name: Unit tests
        run: pytest tests/test_engine.py tests/test_engine_models.py tests/test_worker.py tests/test_desktop.py -q -rs --cov --cov-report=

      - name: Integration / API / security tests
        run: pytest tests/test_api.py tests/test_feedback.py tests/test_notify.py -q -rs --cov --cov-append --cov-report=

      - name: Coverage >= 85 %
        run: coverage report --fail-under=85

      - name: End-to-end tests (Chromium)
        run: pytest tests/e2e/test_ui.py tests/e2e/test_theme.py -q -rs --browser chromium

      - name: Dependency audit (pip-audit)
        run: pip-audit --progress-spinner off

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
